name: Documentation

on:
  push:
    branches: [main]
    # Only when something that can change the site changes. A Kotlin-only commit does not
    # need to redeploy Pages, and the generator is pinned by its own path below.
    paths:
      - 'docs/**'
      - 'docs-generator/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Lets the deploy job publish without a personal token.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes an in-flight one, but never cancels a deploy half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve the Pages base path
        id: base
        # A project site is served from /<repo>; a user or org site (<name>.github.io) is
        # served from the root. Derived rather than hardcoded so renaming the repository
        # does not silently 404 every stylesheet.
        run: |
          repo='${{ github.event.repository.name }}'
          if [[ "$repo" == *.github.io ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate the site
        run: ./gradlew generateDocs -PdocsBaseUrl='${{ steps.base.outputs.path }}' --no-daemon

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-generator/build/docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
